name: Update token usage

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may delay a few minutes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Snapshot from Grafana
        env:
          GRAFANA_PROM_URL: ${{ secrets.GRAFANA_PROM_URL }}
          GRAFANA_PROM_USER: ${{ secrets.GRAFANA_PROM_USER }}
          GRAFANA_TOKEN: ${{ secrets.GRAFANA_TOKEN }}
          TOKEN_METRIC: ${{ vars.TOKEN_METRIC }}
        run: python snapshot.py

      - name: Commit finished days
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Add daily token totals"
            git push
          fi

      - name: Build site
        run: |
          mkdir -p _site/data
          cp index.html _site/
          [ -f data/history.csv ] && cp data/history.csv _site/data/ || true
          [ -f data/today.json ] && cp data/today.json _site/data/ || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
